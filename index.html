    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var currentFetch = typeof rawFetch === 'function' ? rawFetch.bind(window) : rawFetch;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
